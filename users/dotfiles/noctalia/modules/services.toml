[audio]
enable_sounds = false

[battery]
warning_threshold = 20

[bluetooth]
connect_when_enabled = true

[brightness]
enable_ddcutil = true
minimum_brightness = 0.05
sync_all_monitors = true

[brightness.monitor.DP-1] # atelier-01 | Primary
backend = "ddcutil"

[brightness.monitor.DP-2] # atelier-01 | Secondary
backend = "ddcutil"

[brightness.monitor.eDP-1] # voyageur-02 | Laptop Display
backend = "backlight"
backlight_device = "intel_backlight"

[location]
address = ""
auto_locate = true

[weather]
enabled = true
refresh_minutes = 30
unit = "metric"
effects = false

