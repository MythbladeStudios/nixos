[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
builtin_ids = [
  "btop",
  "gtk3",
  "gtk4",
  "kitty",
  "luciole",
  "umbriel",
  "qt"
]

enable_community_templates = true
community_ids = [
  "bat",
  "blender",
  "discord",
  "fastfetch",
  "obs",
  "obsidian",
  "pandora-launcher",
  "sonora"
]

# Plugin Templates

[theme.templates.user.nix_logo]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/nix-logo.svg"
output_path = "$XDG_CACHE_HOME/noctalia/nix-logo.svg"

[theme.templates.user.nix_logo_updates]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/nix-logo-updates.svg"
output_path = "$XDG_CACHE_HOME/noctalia/nix-logo-updates.svg"

[theme.templates.user.nix_logo_error]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/nix-logo-error.svg"
output_path = "$XDG_CACHE_HOME/noctalia/nix-logo-error.svg"

